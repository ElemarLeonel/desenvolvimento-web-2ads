<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com tabelas</title>
    <link rel="stylesheet" href="tabelas.css" />
</head>
<body>
    <!-- Tag Table: Indica a criação de uma tabela -->
    <table>
        <!-- Tag TR (Table Row) - Linha da tabela -->
        <tr>
            <!-- Tag TH (Table Head) - Cabeçalhos da tabela -->
            <th>Nome</th>
            <th>Idade</th>
            <th>Ativo</th>
        </tr>
        <tr>
            <!-- Tag TD (Table Data): 1 Dado -->
            <td>Elemar</td>
            <td>20</td>
            <td>Ativo</td>
        </tr>
        <tr>
            <!-- Tag TD (Table Data): 1 Dado -->
            <td>Rafael</td>
            <td>25</td>
            <td>Inativo</td>
        </tr>
        <tr>
            <!-- Tag TD (Table Data): 1 Dado -->
            <td>Ana</td>
            <td>19</td>
            <td>Ativo</td>
        </tr>
    </table>
</body>
</html>
